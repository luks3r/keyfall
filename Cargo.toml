[workspace]
resolver = "3"
members = ["crates/dsp", "crates/dsp-wasm", "crates/room", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.wasm]
inherits = "release"
opt-level = "s"

[profile.dev.package.keyfall-dsp]
opt-level = 3
