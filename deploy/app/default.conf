# Keyfall web app on its own, with room servers elsewhere (listed in /servers.json, see servers.sh).
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml;

    location = /servers.json {
        alias /tmp/keyfall/servers.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        include /etc/nginx/keyfall-isolation.conf;
    }

    # Vite fingerprints everything here, so it never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/keyfall-isolation.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/keyfall-isolation.conf;
        try_files $uri /index.html;
    }
}
