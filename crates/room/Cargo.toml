[package]
name = "keyfall-room"
version.workspace = true
edition.workspace = true

[[bin]]
name = "keyfall-room"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
local-ip-address = "0.6"
mime_guess = "2"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
